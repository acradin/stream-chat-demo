name: Build Mac desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop-mac.yml'
      - 'apps/desktop/**'
      - 'apps/assets/**'
      - 'backend/env.py'
      - 'backend/personas.py'
      - 'backend/storage.py'
      - 'tests/test_mac_desktop.py'
      - '*desktop_mac.command'
permissions:
  contents: read
jobs:
  mac:
    name: Mac ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install client and build dependencies
        run: python -m pip install -r apps/desktop/mac/requirements.txt -r apps/desktop/packaging/requirements-build.txt
      - name: Check Mac adapter contracts
        run: python -B -m unittest discover -s tests -p test_mac_desktop.py -v
      - name: Build development app and DMG with hidden UI self-test
        run: python -B apps/desktop/mac/packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: tiki-mac-development-${{ matrix.arch }}
          path: |
            dist/mac/*.dmg
            dist/mac/*.self-test.json
          if-no-files-found: error
